<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻量级游戏制作工具</title>
    <link rel="stylesheet" href="styles.css">
    <!-- 引入Phaser.js游戏引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <!-- 引入Bootstrap用于UI -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <header class="bg-dark text-white py-3">
            <div class="container">
                <h1 class="text-center">轻量级游戏制作工具</h1>
                <p class="text-center">支持手机与电脑通用的游戏开发平台</p>
            </div>
        </header>
        
        <div class="row mt-4">
            <!-- 左侧游戏编辑器 -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3>游戏编辑器</h3>
                    </div>
                    <div class="card-body">
                        <div id="game-container" class="border rounded" style="width: 100%; height: 400px;"></div>
                        <div class="mt-3">
                            <h4>游戏控制</h4>
                            <div class="row mb-2">
                                <div class="col-md-4">
                                    <button id="start-btn" class="btn btn-success w-100">开始游戏</button>
                                </div>
                                <div class="col-md-4">
                                    <button id="pause-btn" class="btn btn-warning w-100">暂停游戏</button>
                                </div>
                                <div class="col-md-4">
                                    <button id="reset-btn" class="btn btn-danger w-100">重置游戏</button>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-12">
                                    <button id="advanced-mode-btn" class="btn btn-primary" style="background-color: purple; border-color: purple; width: 100%;">高级模式</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧AI助手 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h3>AI游戏助手</h3>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="ai-prompt" class="form-label">输入游戏设计需求：</label>
                            <textarea id="ai-prompt" class="form-control" rows="3" placeholder="例如：创建一个简单的平台跳跃游戏，包含玩家角色和障碍物"></textarea>
                        </div>
                        <button id="ai-generate" class="btn btn-primary w-100">生成游戏代码</button>
                        <div class="mt-3">
                            <h4>AI生成结果：</h4>
                            <div id="ai-result" class="border rounded p-2 bg-light" style="min-height: 200px; max-height: 300px; overflow-y: auto;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer class="mt-4 bg-dark text-white py-3">
            <div class="container text-center">
                <p>轻量级游戏制作工具 &copy; 2026</p>
            </div>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
