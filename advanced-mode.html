<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级模式 - 轻量级游戏制作工具</title>
    <!-- 引入样式和脚本 -->
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* 自定义样式 */
        .element-list { 
            max-height: 350px; 
            min-height: 180px; /* 新增：确保最小高度 */
            overflow-y: auto; 
        }
        .element-item { 
            cursor: pointer; 
            transition: background-color 0.2s; 
        }
        .element-item:hover { 
            background-color: #f0f0f0; 
        }
        .element-item.selected { 
            background-color: #e3f2fd; 
            border: 2px solid #0d6efd; 
        }
        .element-image { 
            width: 50px; 
            height: 50px; 
            object-fit: contain; 
            background: #f8f9fa; 
        }
        .property-editor { 
            min-height: 300px; /* 优化：与右侧代码区平齐 */
            overflow-y: auto; 
        }
        #code-viewer { 
            font-family: 'Courier New', monospace; 
            font-size: 12px; 
            white-space: pre-wrap; 
            min-height: 280px; /* 优化：设定最小高度 */
            background: #f8f9fa;
        }
        #context-menu { 
            position: absolute; 
            z-index: 1000; 
            display: none; 
            background: white; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }
        #context-menu .dropdown-item { 
            cursor: pointer; 
            padding: 8px 16px; 
        }
        #context-menu .dropdown-item:hover { 
            background-color: #f0f0f0; 
        }
        /* 调整游戏容器样式 */
        #game-container {
            width: 100%;
            height: 400px;
            overflow: hidden;
            background: #000;
            position: relative;
            border-radius: 4px;
        }
        .card {
            margin-bottom: 1rem; /* 统一卡片间距 */
        }
        .card-body {
            padding: 1rem; /* 统一内边距 */
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 页眉 -->
        <header class="bg-dark text-white py-2">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-6"><h4 class="mb-0">轻量级游戏制作工具 - 高级模式</h4></div>
                    <div class="col-md-6 text-end"><button id="back-btn" class="btn btn-primary btn-sm">返回普通模式</button></div>
                </div>
            </div>
        </header>
        
        <!-- 主内容区：三列布局 -->
        <div class="row mt-3">
            <!-- 第一列：游戏编辑器与控制 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header"><h5>游戏编辑器</h5></div>
                    <div class="card-body p-2">
                        <div id="game-container" class="border rounded"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h5>游戏控制</h5></div>
                    <div class="card-body">
                        <div class="row mb-2">
                            <div class="col-md-4"><button id="start-btn" class="btn btn-success w-100 btn-sm">开始</button></div>
                            <div class="col-md-4"><button id="pause-btn" class="btn btn-warning w-100 btn-sm">暂停</button></div>
                            <div class="col-md-4"><button id="reset-btn" class="btn btn-danger w-100 btn-sm">重置</button></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6"><button id="advanced-mode-btn" class="btn btn-primary btn-sm" style="background-color: purple; border-color: purple; width: 100%;">高级模式</button></div>
                            <div class="col-md-6"><button id="download-code-btn" class="btn btn-success btn-sm" style="width: 100%;">下载游戏HTML</button></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 第二列：元素管理与属性编辑 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">游戏元素列表</h5>
                        <button id="add-element-btn" class="btn btn-success btn-sm">+ 添加元素</button>
                    </div>
                    <div class="card-body p-2">
                        <div id="element-list" class="element-list"></div>
                    </div>
                </div>
                <div class="card" style="flex-grow: 1;"> <!-- 新增flex-grow属性使其填充空间 -->
                    <div class="card-header"><h5>元素属性</h5></div>
                    <div class="card-body property-editor">
                        <div id="property-editor"><p class="text-muted">请选择一个元素查看并编辑其属性</p></div>
                    </div>
                </div>
            </div>
            
            <!-- 第三列：AI助手与代码视图 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header"><h5>AI游戏助手</h5></div>
                    <div class="card-body">
                        <div class="mb-2">
                            <label for="ai-prompt" class="form-label">输入游戏设计需求：</label>
                            <textarea id="ai-prompt" class="form-control" rows="2" placeholder="例如：添加一个会移动的敌人"></textarea>
                        </div>
                        <button id="ai-generate" class="btn btn-primary w-100 btn-sm">生成游戏代码</button>
                        <div class="mt-2">
                            <div id="ai-result" class="border rounded p-2 bg-light" style="min-height: 150px; max-height: 200px; overflow-y: auto;"></div>
                        </div>
                    </div>
                </div>
                <!-- “相关代码”板块已移动到此，位于AI助手下方 -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">相关代码</h5>
                        <small class="text-muted">基于上方元素动态生成</small>
                    </div>
                    <div class="card-body p-2">
                        <div id="code-viewer" class="border rounded p-2">
                            <p class="text-muted m-0">游戏代码将在此处显示...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 页脚 -->
        <footer class="mt-3 bg-dark text-white py-2 text-center">
            <p class="mb-0">轻量级游戏制作工具 &copy; 2026</p>
        </footer>
    </div>
    
    <!-- 右键上下文菜单 -->
    <div id="context-menu" class="dropdown-menu">
        <a class="dropdown-item" id="bring-to-front">置顶</a>
        <a class="dropdown-item" id="send-to-back">置底</a>
    </div>
    
    <!-- 隐藏的图片上传输入 -->
    <input type="file" id="image-upload" accept="image/*" style="display: none;">
    
    <!-- 引入核心编辑器逻辑 -->
    <script src="advanced-editor.js"></script>
</body>
</html>
